<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ... (Bagian head tetap sama) ... -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopee Affiliate Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ... (Bagian CSS tetap sama) ... */
        body { font-size: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow-x: hidden; background-color: #f8f9fa; }
        #wrapper { overflow-x: hidden; }
        #sidebar-wrapper { min-height: 100vh; width: 220px; transition: margin 0.25s ease-out; }
        #sidebar-wrapper .sidebar-heading { font-size: 14px; letter-spacing: 0.5px; }
        #sidebar-wrapper .list-group-item { font-size: 12px; padding: 12px 20px; border: none; transition: all 0.2s; cursor: pointer; }
        #sidebar-wrapper .list-group-item:hover { background-color: rgba(255, 255, 255, 0.1) !important; color: #fff !important; }
        #sidebar-wrapper .list-group-item.active { background-color: #ff5722 !important; color: #fff !important; font-weight: bold; }
        .text-orange { color: #ff5722; }
        .table-responsive { max-height: 70vh; overflow-y: auto; }
        table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
        table td { font-size: 12px; white-space: nowrap; }
        .card { border-radius: 6px; }
        .kpi-card { border-left: 4px solid #ff5722; }
        #wrapper.toggled #sidebar-wrapper { margin-left: -220px; }
        @media (max-width: 768px) { #sidebar-wrapper { margin-left: -220px; } #wrapper.toggled #sidebar-wrapper { margin-left: 0; } }
        .detail-row { background-color: #f1f3f5 !important; }
        .detail-table-container { padding: 10px 20px; background-color: #ffffff; border: 1px solid #dee2e6; border-radius: 4px; }
    </style>
</head>
<body>
    <!-- ... (Struktur HTML body tetap sama, hanya bagian script yang diubah) ... -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 11;">
        <!-- ... -->
    </div>
    <div class="d-flex" id="wrapper">
        <!-- ... -->
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let globalData = { meta: [], webClick: [], affiliate: [], processed: { totals: {}, byTagLink: {} }, metaDate: "Nama file tidak valid" };
        let activeChart = null;

        // ... (Fungsi UI dan utilitas tetap sama: menu-toggle, switchMenu, showToast, parseCSVFile, extractDateFromCommissionFilename, cleanNumber) ...

        document.getElementById('menu-toggle').addEventListener('click', function () { document.getElementById('wrapper').classList.toggle('toggled'); });
        window.addEventListener('DOMContentLoaded', () => { renderSavedReportsTable(); });

        function switchMenu(menuId) {
            document.querySelectorAll('.menu-section').forEach(section => section.classList.add('d-none'));
            document.querySelectorAll('#sidebar-wrapper .list-group-item').forEach(item => item.classList.remove('active'));
            document.getElementById(`menu-${menuId}`).classList.remove('d-none');
            if(window.event && window.event.currentTarget && window.event.currentTarget.tagName === 'BUTTON') {
                window.event.currentTarget.classList.add('active');
            } else {
                document.querySelectorAll('#sidebar-wrapper .list-group-item').forEach(item => {
                    if(item.getAttribute('onclick').includes(menuId)) item.classList.add('active');
                });
            }
            let title = menuId.charAt(0).toUpperCase() + menuId.slice(1);
            if(menuId === 'taglink') title = "TagLink Analyze";
            if(menuId === 'savedreports') title = "Saved Reports (Local Storage)";
            document.getElementById('menu-title').innerText = title;
        }

        function showToast(message, isDanger = true) {
            const toastEl = document.getElementById('liveToast');
            if(isDanger) { toastEl.classList.replace('bg-success', 'bg-danger'); } 
            else { toastEl.classList.replace('bg-danger', 'bg-success'); }
            document.getElementById('toastMessage').innerText = message;
            new bootstrap.Toast(toastEl).show();
        }

        function parseCSVFile(file, requiredHeaders) {
            return new Promise((resolve, reject) => {
                if (!file) return resolve([]);
                Papa.parse(file, {
                    header: true, skipEmptyLines: true, dynamicTyping: true,
                    complete: function (results) {
                        if (results.data.length > 0) {
                            const headers = Object.keys(results.data[0]);
                            const missing = requiredHeaders.filter(h => !headers.includes(h));
                            // Perubahan 1: Hapus requirement header Tag_link1 secara hardcode karena sekarang kita mencari Tag_link1 sampai 5
                            const isAffiliate = requiredHeaders.includes('Komisi Bersih Affiliate (Rp)');
                            if (missing.length > 0 && !isAffiliate) {
                                reject(`Format CSV tidak dikenali. Header Hilang: ${missing.join(', ')}`);
                                return;
                            }
                        }
                        resolve(results.data);
                    },
                    error: function () { reject("Format CSV tidak dikenali atau gagal membaca file."); }
                });
            });
        }

        function extractDateFromCommissionFilename(filename) { /* ... sama ... */ 
            const match = filename.match(/(\d{4})(\d{2})(\d{2})/);
            if (match) {
                const year = match[1];
                const monthNumbers = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                const monthIndex = parseInt(match[2]) - 1;
                const month = monthNumbers[monthIndex] || match[2];
                let day = parseInt(match[3]);
                let dayString = day < 10 ? '0' + day : day.toString();
                return `${dayString} ${month} ${year}`;
            }
            return "Nama file tidak valid";
        }
        
        function cleanNumber(val) { /* ... sama ... */ 
            if (val === undefined || val === null) return 0;
            if (typeof val === 'number') return val;
            let str = String(val).replace(/[^0-9.-]/g, '');
            let parsed = parseFloat(str);
            return isNaN(parsed) ? 0 : parsed;
        }

        async function processCSV() {
            const fileMeta = document.getElementById('fileMeta').files[0];
            const fileWebClick = document.getElementById('fileWebClick').files[0];
            const fileAffiliate = document.getElementById('fileAffiliate').files[0];

            if (!fileAffiliate) {
                showToast("Format CSV tidak dikenali. Harap pilih file Affiliate Commission terlebih dahulu.");
                return;
            }

            document.getElementById('loadingSpinner').classList.remove('d-none');

            try {
                globalData.metaDate = extractDateFromCommissionFilename(fileAffiliate.name);
                globalData.meta = fileMeta ? await parseCSVFile(fileMeta, ['Nama iklan', 'Jumlah yang dibelanjakan (IDR)', 'Indikator Hasil', 'Hasil']) : [];
                globalData.webClick = fileWebClick ? await parseCSVFile(fileWebClick, ['Tag_link']) : [];
                
                // Perubahan 2: Menambahkan 'ID Pemesanan' ke dalam list pengecekan untuk menghitung jumlah pesanan
                globalData.affiliate = await parseCSVFile(fileAffiliate, ['ID Pemesanan', 'Komisi Bersih Affiliate (Rp)', 'Nama Barange', 'Status Pesanan']);

                aggregateData();
                
                // Perbarui Header Tabel dari "Produk Terjual" menjadi "Pesanan"
                updateTableHeadersToOrders();

                renderDashboard();
                renderTagLinkTable();
                renderAtribusiTable();
                renderChart();
                renderSavedReportsTable();
                
                switchMenu('dashboard');

            } catch (error) {
                console.error(error);
                showToast(error);
            } finally {
                document.getElementById('loadingSpinner').classList.add('d-none');
            }
        }

        function updateTableHeadersToOrders() {
            // Ubah teks header pada tabel agar sesuai dengan "Jumlah Pesanan"
            const thElements = document.querySelectorAll('th');
            thElements.forEach(th => {
                if (th.innerText === 'Produk') th.innerText = 'Pesanan';
                if (th.innerText === 'Produk Terjual') th.innerText = 'Total Pesanan';
            });
        }

        function aggregateData() {
            let dataset = {};

            // 1. Data Web Click
            if (globalData.webClick && globalData.webClick.length > 0) {
                globalData.webClick.forEach(row => {
                    let rawTag = row['Tag_link'];
                    let trafficSource = row['Perujuk'] || 'Direct / Unknown'; 
                    let tag = '';
                    
                    if (rawTag === undefined || rawTag === null || String(rawTag).trim() === '') {
                        tag = 'unassigned';
                        rawTag = 'unassigned';
                    } else {
                        tag = String(rawTag).replace(/-+$/, "").toLowerCase().trim();
                        if (tag === '') { tag = 'unassigned'; rawTag = 'unassigned'; }
                    }

                    if (!dataset[tag]) dataset[tag] = createDataTemplate(rawTag === 'unassigned' ? 'unassigned' : rawTag.replace(/-+$/, ""));
                    dataset[tag].klikShopee += 1;

                    if (!dataset[tag].trafficSources.includes(trafficSource)) {
                        dataset[tag].trafficSources.push(trafficSource);
                    }
                });
            }

            // 2. Data Meta Ads
            if (globalData.meta && globalData.meta.length > 0) {
                globalData.meta.forEach(row => {
                    let rawAdName = row['Nama iklan'] || 'Unknown';
                    let adName = rawAdName.toLowerCase().trim();
                    let hasilIndicator = row['Indikator Hasil'] || '';
                    let isClick = hasilIndicator.toLowerCase().includes('actions:link_click');
                    let clicks = isClick ? (parseInt(row['Hasil']) || 0) : 0;
                    let spend = cleanNumber(row['Jumlah yang dibelanjakan (IDR)']);

                    let matched = false;
                    for (let tag in dataset) {
                        if (tag === 'unassigned') continue;
                        
                        if (tag.includes(adName) || adName.includes(tag)) {
                            dataset[tag].klikMeta += clicks;
                            dataset[tag].spend += spend;
                            if (!dataset[tag].campaigns.includes(rawAdName)) {
                                dataset[tag].campaigns.push(rawAdName);
                            }
                            matched = true;
                        }
                    }

                    if (!matched && adName !== '') {
                        if (!dataset[adName]) dataset[adName] = createDataTemplate(rawAdName);
                        dataset[adName].klikMeta += clicks;
                        dataset[adName].spend += spend;
                        if (!dataset[adName].campaigns.includes(rawAdName)) {
                            dataset[adName].campaigns.push(rawAdName);
                        }
                    }
                });
            }

            // 3. Data Affiliate (Perubahan Utama)
            let processedOrderIdsByTag = {}; // Untuk melacak ID pesanan unik per tag
            let totalUniqueOrdersTracker = new Set(); // Melacak total semua pesanan unik

            globalData.affiliate.forEach(row => {
                // Perubahan 3: Logika menggabungkan Tag_link1 sampai Tag_link5
                let tagList = [];
                const tagColumns = ['Tag_link1', 'Tag_link2', 'Tag_link3', 'Tag_link4', 'Tag_link5'];
                
                tagColumns.forEach(col => {
                    if (row[col] !== undefined && row[col] !== null) {
                        let val = String(row[col]).trim();
                        if (val.toLowerCase() !== '' && val.toLowerCase() !== 'nan' && val.toLowerCase() !== 'none') {
                            tagList.push(val);
                        }
                    }
                });

                let rawTag = tagList.length > 0 ? tagList.join('-') : 'unassigned';
                let tag = rawTag.toLowerCase().trim();

                let komisi = cleanNumber(row['Komisi Bersih Affiliate (Rp)']);
                let produkName = row['Nama Barange'] || 'Unknown';
                let status = row['Status Pesanan'] || 'Completed';
                let orderId = row['ID Pemesanan'] || 'Unknown-' + Math.random(); // Perubahan 4: Ambil ID Pemesanan

                if (!dataset[tag]) dataset[tag] = createDataTemplate(rawTag);
                if (!processedOrderIdsByTag[tag]) processedOrderIdsByTag[tag] = new Set();
                
                dataset[tag].komisi += komisi;
                
                // Perubahan 5: Hitung Jumlah Pesanan berdasarkan ID Pemesanan yang unik
                if (!processedOrderIdsByTag[tag].has(orderId)) {
                    processedOrderIdsByTag[tag].add(orderId);
                    dataset[tag].produkTerjual += 1; // Disini 'produkTerjual' sekarang berfungsi sebagai 'Jumlah Pesanan'
                }
                
                totalUniqueOrdersTracker.add(orderId); // Track untuk grand total
                
                // Rincian produk tetap dihitung per baris untuk modal detail
                let existingProd = dataset[tag].productDetails.find(p => p.name === produkName);
                if(existingProd) {
                    existingProd.qty += 1;
                    existingProd.komisi += komisi;
                } else {
                    dataset[tag].productDetails.push({ name: produkName, qty: 1, komisi: komisi, status: status });
                }
            });

            let grandTotals = createDataTemplate('TOTAL REKAP');
            
            // Grand Total Pesanan diambil dari Set global agar tidak double count pesanan yang sama di tag yang berbeda (jika ada skenario aneh)
            // Namun, umumnya 1 pesanan = 1 tag.
            grandTotals.produkTerjual = totalUniqueOrdersTracker.size;

            for (let tag in dataset) {
                let d = dataset[tag];
                d.profit = d.komisi - d.spend;
                d.roi = d.spend > 0 ? (d.profit / d.spend) * 100 : 0;
                d.roas = d.spend > 0 ? (d.komisi / d.spend) : 0;
                d.avgKomisi = d.produkTerjual > 0 ? (d.komisi / d.produkTerjual) : 0; // Avg per pesanan

                grandTotals.klikMeta += d.klikMeta;
                grandTotals.klikShopee += d.klikShopee;
                // grandTotals.produkTerjual += d.produkTerjual; (Sudah dihitung via Set diatas)
                grandTotals.spend += d.spend;
                grandTotals.komisi += d.komisi;
            }

            grandTotals.profit = grandTotals.komisi - grandTotals.spend;
            grandTotals.roi = grandTotals.spend > 0 ? (grandTotals.profit / grandTotals.spend) * 100 : 0;

            globalData.processed.byTagLink = dataset;
            globalData.processed.totals = grandTotals;
        }

        function createDataTemplate(displayTag) {
            return { 
                displayTag: displayTag, 
                klikMeta: 0, klikShopee: 0, produkTerjual: 0, // 'produkTerjual' sekarang artinya Jumlah Pesanan
                spend: 0, komisi: 0, profit: 0, roi: 0, roas: 0, avgKomisi: 0, 
                campaigns: [], productDetails: [], trafficSources: [] 
            };
        }

        // ... (Fungsi render UI lainnya seperti renderDashboard, formatIDR, dll tidak perlu banyak diubah 
        // karena kita mengakali 'produkTerjual' agar berisi jumlah pesanan) ...
        
        function formatIDR(num) { return 'Rp ' + Math.round(num).toLocaleString('id-ID'); }

        function renderDashboard() {
            const totals = globalData.processed.totals;
            const cpc = totals.klikMeta > 0 ? totals.spend / totals.klikMeta : 0;
            const cvr = totals.klikShopee > 0 ? (totals.produkTerjual / totals.klikShopee) * 100 : 0;

            // Perubahan teks 'Produk Terjual' menjadi 'Total Pesanan'
            document.getElementById('kpi-container').innerHTML = `
                ${createKPICard('Spend Meta', formatIDR(totals.spend))}
                ${createKPICard('Klik Meta', totals.klikMeta.toLocaleString('id-ID'))}
                ${createKPICard('Klik Shopee', totals.klikShopee.toLocaleString('id-ID'))}
                ${createKPICard('Total Pesanan', totals.produkTerjual.toLocaleString('id-ID'))} 
                ${createKPICard('Komisi Shopee', formatIDR(totals.komisi))}
                ${createKPICard('Profit', formatIDR(totals.profit), totals.profit >= 0 ? 'text-success' : 'text-danger')}
                ${createKPICard('ROI', totals.roi.toFixed(2) + '%')}
                ${createKPICard('CPC', formatIDR(cpc))}
                ${createKPICard('Conversion Rate', cvr.toFixed(2) + '%')}
            `;

            document.getElementById('tableDashboardBody').innerHTML = `
                <tr>
                    <td class="fw-bold text-orange">${globalData.metaDate}</td>
                    <td>${totals.klikMeta.toLocaleString('id-ID')}</td>
                    <td>${totals.klikShopee.toLocaleString('id-ID')}</td>
                    <td>${totals.produkTerjual.toLocaleString('id-ID')}</td>
                    <td>${formatIDR(totals.spend)}</td>
                    <td>${formatIDR(totals.komisi)}</td>
                    <td class="${totals.profit >= 0 ? 'text-success':'text-danger'}">${formatIDR(totals.profit)}</td>
                    <td>${totals.roi.toFixed(2)}%</td>
                </tr>
            `;
        }

        function createKPICard(title, value, colorClass = '') { /* ... sama ... */ 
            return `<div class="col"><div class="card p-2 bg-white shadow-sm h-100 kpi-card"><div class="text-muted" style="font-size:10px;">${title}</div><div class="fw-bold fs-6 ${colorClass}">${value}</div></div></div>`;
        }
        
        // ... (Biarkan fungsi save, chart, render tabel yang lainnya ada di bawah ini. Saya hanya memotong 
        // bagian atas karena perubahan utamanya ada pada aggregateData() dan proses parseCSV) ...
        
        // Copy fungsi renderTagLinkTable, renderAtribusiTable, saveReportToStorage dsb secara utuh dari kode asal Anda
        // dan gantilah header "Produk Terjual" / "Produk" menjadi "Pesanan" pada export CSV jika diperlukan.

    </script>
</body>
</html>
